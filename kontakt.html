<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kontakt | No to pięknie!</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --cream:#E4D8A8;
    --rose:#C8A09C;
    --rose-dark:#A27F7C;

    --gray:#A3A094;
    --gray-dark:#878375;

    --brown:#68484A;
    --brown-dark:#523739;

    --background:#F9F6F2;

    --card:#FFFFFF;
    --text:#53484A;
    --text-light:#83777A;

    --border:#ECE5DE;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--background);
    color:var(--text);
    font-family:'Montserrat',sans-serif;
}

/* HEADER */

header{
    background:linear-gradient(
        180deg,
        var(--cream) 0%,
        var(--rose) 50%,
        var(--brown) 100%
    );

    color:white;
    text-align:center;
    padding:50px 20px;
}

header h1{
    margin:0;
    font-family:'Cormorant Garamond',serif;
    font-size:3rem;
    font-weight:600;
    letter-spacing:4px;
}

header p{
    margin-top:12px;
    font-size:1.1rem;
}

/* CONTENT */

.container{
    max-width:900px;
    margin:50px auto;
    padding:0 20px;
}

.contact-box{
    background:white;
    border-radius:25px;
    padding:40px;

    border:1px solid var(--border);

    box-shadow:
        0 5px 15px rgba(104,72,74,.04),
        0 15px 35px rgba(104,72,74,.08);

    text-align:center;
}

.contact-box h2{
    margin-top:0;

    color:var(--rose-dark);

    font-family:'Cormorant Garamond',serif;
    font-size:2.8rem;
    font-weight:600;
}

.contact-box p{
    max-width:650px;
    margin:0 auto 40px;

    text-align:center;
    line-height:1.8;

    color:var(--text-light);
}

/* PRZYCISKI */

.buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;

    margin-top:20px;
}

.button{
    display:inline-block;

    min-width:220px;

    padding:14px 28px;

    border-radius:14px;

    text-decoration:none;

    color:white;

    font-weight:600;

    transition:.3s;
}

.button-back{
    background:var(--gray);
}

.button-back:hover{
    background:var(--gray-dark);
}

.button-booksy{
    background:var(--rose);
}

.button-booksy:hover{
    background:var(--rose-dark);
}

/* FOOTER */

footer{
    margin-top:60px;

    background:var(--brown);

    color:white;

    text-align:center;

    padding:25px;
}

footer p{
    margin:0;
}

/* MOBILE */

@media (max-width:768px){

    header{
        padding:35px 15px;
    }

    header h1{
        font-size:2rem;
    }

    header p{
        font-size:.95rem;
    }

    .contact-box{
        padding:25px;
    }

    .contact-box h2{
        font-size:2rem;
    }

    .buttons{
        flex-direction:column;
    }

    .button{
        width:100%;
        min-width:auto;
    }

}

</style>
</head>

<body>

<header>
    <h1>KONTAKT</h1>
    <p>No to pięknie! • Stylizacja paznokci • Makijaż okazjonalny • Bydgoszcz</p>
</header>

<div class="container">

    <div class="contact-box">

        <h2>Iwona Bieńkowska</h2>

        <p>
            Zapraszam do kontaktu poprzez Facebook, Instagram
            lub rezerwację wizyty online przez Booksy.
        </p>

        <div class="buttons">

            <a href="https://www.facebook.com/profile.php?id=100008602985310"
               target="_blank"
               class="button button-back">
                Facebook
            </a>

            <a href="https://instagram.com/notopieknie_iwonabienkowska"
               target="_blank"
               class="button button-back">
                Instagram
            </a>

            <a href="https://booksy.com/pl-pl/121304_no-to-pieknie-wizaz-i-kosmetyka_paznokcie_22068_bydgoszcz"
               target="_blank"
               class="button button-booksy">
                Umów wizytę
            </a>

        </div>

        <div class="buttons">

            <a href="index.html"
               class="button button-back">
                ← Powrót do strony głównej
            </a>

        </div>

    </div>

</div>

<footer>
    <p>© 2026 No to pięknie! | Iwona Bieńkowska</p>
</footer>

</body>
</html>
