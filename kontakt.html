<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt | No to pięknie!</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            background-color: #f6faf7;
            color: #4f5f57;
        }

        header {
            background-color: #7ea696;
            color: white;
            padding: 25px;
        }

        h1 {
            margin-bottom: 5px;
            font-weight: 600;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .contact-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(126, 166, 150, 0.2);
        }

        .contact-box p {
            font-size: 18px;
            margin: 15px 0;
        }

        .button {
            display: inline-block;
            margin-top: 15px;
            background: #7ea696;
            color: white;
            text-decoration: none;
            padding: 15px 25px;
            border-radius: 15px;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(126, 166, 150, 0.35);
            transition: all 0.3s ease;
        }

        .button:hover {
            background: #6b9583;
            transform: translateY(-3px);
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #7ea696;
            text-decoration: none;
            font-weight: 600;
        }

        footer {
            margin-top: 60px;
            padding: 20px;
            background: #dfece5;
            color: #4f5f57;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Kontakt</h1>
        <p>No to pięknie! • Stylizacja paznokci • Bydgoszcz</p>
    </header>

    <div class="container">
        <div class="contact-box">

            <h2>Iwona Bieńkowska</h2>

            <p>
                Zapraszam do kontaktu poprzez Facebook, Instagram
                lub rezerwację wizyty online.
            </p>

            <a class="button"
               href="https://www.facebook.com/profile.php?id=100008602985310"
               target="_blank">
                Facebook
            </a>

            <br><br>

            <a class="button"
               href="https://instagram.com/notopieknie_iwonabienkowska"
               target="_blank">
                Instagram
            </a>

            <br><br>

            <a class="button"
               href="https://booksy.com/pl-pl/121304_no-to-pieknie-wizaz-i-kosmetyka_paznokcie_22068_bydgoszcz"
               target="_blank">
                Umów wizytę
            </a>

        </div>

        <a href="index.html" class="back-link">
            ← Powrót do strony głównej
        </a>
    </div>

    <footer>
        <p>© 2026 No to pięknie! | Iwona Bieńkowska</p>
    </footer>

</body>
</html>
