<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria - No to pięknie!</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f1e8;
            color: #4a3b2a;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #556b2f;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .gallery img {
            width: 300px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .back {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 24px;
            background: #8b5a2b;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h1>Galeria stylizacji</h1>

    <div class="gallery">
        <img src="galeria1.jpg" alt="Paznokcie 1">
