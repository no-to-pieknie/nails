<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria | No to pięknie!</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            background-color: #f6faf7;
            color: #4f5f57;
        }

        header {
            background-color: #7ea696;
            color: white;
            padding: 25px;
        }

        h1 {
            margin-bottom: 5px;
            font-weight: 600;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .gallery-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(126, 166, 150, 0.2);
        }

        .gallery-box p {
            font-size: 18px;
            margin-bottom: 30px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .gallery-grid img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-radius: 15px;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 10px rgba(126, 166, 150, 0.2);
        }

        .gallery-grid img:hover {
            transform: scale(1.03);
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #7ea696;
            text-decoration: none;
            font-weight: 600;
        }

        footer {
            margin-top: 60px;
            padding: 20px;
            background: #dfece5;
            color: #4f5f57;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .gallery-grid img {
                height: 250px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Galeria</h1>
        <p>No to pięknie! • Stylizacja paznokci • Bydgoszcz</p>
    </header>

    <div class="container">

        <div class="gallery-box">

            <h2>Moje stylizacje</h2>

            <p>
                Kilka wybranych realizacji. Zapraszam również na Instagram,
                gdzie regularnie publikuję nowe stylizacje.
            </p>

            <div class="gallery-grid">

                <img src="galeria1.jpg" alt="Stylizacja paznokci 1">
                <img src="galeria2.jpg" alt="Stylizacja paznokci 2">
                <img src="galeria3.jpg" alt="Stylizacja paznokci 3">
                <img src="galeria4.jpg" alt="Stylizacja paznokci 4">
                <img src="galeria5.jpg" alt="Stylizacja paznokci 5">
                <img src="galeria6.jpg" alt="Stylizacja paznokci 6">
                <img src="galeria7.jpg" alt="Stylizacja paznokci 7">
                <img src="galeria8.jpg" alt="Stylizacja paznokci 8">
                <img src="galeria9.jpg" alt="Stylizacja paznokci 9">
                <img src="galeria10.jpg" alt="Stylizacja paznokci 10">
            </div>

        </div>

        <a href="index.html" class="back-link">
            ← Powrót do strony głównej
        </a>

    </div>

    <footer>
        <p>© 2026 No to pięknie! | Iwona Bieńkowska</p>
    </footer>

</body>
</html>
