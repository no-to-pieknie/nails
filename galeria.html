       <style>

*{
    box-sizing:border-box;
}

body{
    font-family:'Montserrat',sans-serif;
    margin:0;
    padding:0;
    text-align:center;
    background-color:#f6faf7;
    color:#4f5f57;
}

h1,
h2,
h3{
    font-family:'Cormorant Garamond',serif;
    letter-spacing:1px;
}

header{
    background-color:#7ea696;
    color:white;
    padding:25px;
}

h1{
    margin-bottom:5px;
    font-size:3rem;
    font-weight:600;
    letter-spacing:2px;
}

h2{
    font-size:2rem;
    font-weight:600;
}

.container{
    max-width:1200px;
    margin:40px auto;
    padding:0 20px;
}

.gallery-box{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 4px 15px rgba(126,166,150,0.2);
}

.gallery-box p{
    font-size:18px;
    margin-bottom:30px;
    line-height:1.8;
}

.gallery-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.gallery-grid img{
    width:100%;
    height:320px;
    object-fit:cover;
    border-radius:15px;
    transition:all .3s ease;
    box-shadow:0 4px 10px rgba(126,166,150,.2);
}

.gallery-grid img:hover{
    transform:scale(1.03);
}

.back-link{
    display:inline-block;
    margin-top:30px;
    color:#7ea696;
    text-decoration:none;
    font-weight:600;
}

footer{
    margin-top:60px;
    padding:20px;
    background:#dfece5;
    color:#4f5f57;
    font-size:14px;
}

@media (max-width:768px){

    h1{
        font-size:2.1rem;
    }

    h2{
        font-size:1.8rem;
    }

    .gallery-grid img{
        height:250px;
    }

}

</style>
